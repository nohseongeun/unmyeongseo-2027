<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEAM MARBLE · 송년회</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f7ff;background:#0c1024}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#26305e,#0c1024 65%)}header{padding:18px 20px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ffffff20}h1{margin:0;font-size:25px}.sub{opacity:.65;font-size:12px}.layout{max-width:1300px;padding:16px;margin:auto;display:grid;grid-template-columns:minmax(280px,1.6fr) minmax(260px,1fr);gap:16px}.panel{background:#1c2444;border:1px solid #3d497b;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px #0003}h2{font-size:19px;margin:0 0 12px}button,select,input{border:1px solid #6478bc;border-radius:12px;padding:12px;background:#2b3764;color:white;font-size:15px}button{cursor:pointer;font-weight:700}button.primary{background:#7760f6;border-color:#9381ff}button.green{background:#087c6a}button.red{background:#9e345f}button:disabled{opacity:.4}.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.tile{position:relative;min-height:86px;background:#2c375c;border:1px solid #485784;border-radius:10px;padding:7px 4px;text-align:center;overflow:hidden}.tile.current{outline:3px solid #facb61}.tile .nr{font-size:10px;opacity:.6}.tile .nm{font-size:12px;font-weight:800;margin:3px 0}.tile .cost{font-size:10px;opacity:.8}.tile .owner{height:6px;border-radius:5px;margin:3px 0}.tokens{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}.token{width:12px;height:12px;border-radius:50%;border:2px solid white}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.teams{display:grid;gap:7px}.team{padding:10px;border:1px solid #4b5784;border-radius:12px;background:#202b50}.turn{border-color:#ffde6b;box-shadow:0 0 0 1px #ffde6b}.tag{border-radius:30px;padding:5px 9px;background:#323f70;font-size:12px}.money{font-weight:800;color:#ffd66d}.mission{border:2px solid #e9a14f;background:#432d50}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.buttons button{flex:1}.bigdice{font-size:62px;text-align:center;margin:8px 0}.info{color:#a9b9eb;font-size:14px;line-height:1.6}.rank{padding:9px;border-bottom:1px solid #ffffff20}#notice{padding:10px 0;color:#ffdd8d}#qr{background:white;padding:8px;border-radius:9px;max-width:150px;width:100%;display:block;margin:auto}.hidden{display:none!important}@media(max-width:830px){.layout{grid-template-columns:1fr}.board{gap:3px}.tile{min-height:65px;padding:4px 1px}.tile .nm{font-size:10px}.tile .cost{font-size:9px}.token{width:9px;height:9px}.panel{padding:12px}} </style></head><body>
<header><div><h1>🎲 TEAM MARBLE</h1><span class="sub">송년회 실시간 팀 대항 액티비티 부루마블</span></div><div class="row"><button onclick="setMode('view')">📺 전광판</button><button onclick="setMode('player')">📱 팀 참가</button><button onclick="setMode('admin')">🎤 관리자</button></div></header>
<main class="layout"><section><div class="panel"><div class="row"><h2>🏙️ 게임판 28칸</h2><span id="round" class="tag"></span></div><div id="board" class="board"></div></div><div class="panel"><h2>🏆 실시간 순위</h2><div id="rank"></div></div></section><aside><div class="panel"><div class="row"><h2>🎮 진행 상황</h2><span id="phase" class="tag"></span></div><div class="bigdice" id="dice">🎲</div><h2 id="turnTitle">게임 준비 중</h2><div id="message" class="info"></div><div id="notice"></div><div id="join" class="hidden"><h2>내 팀 선택</h2><select id="joinTeam"></select><div class="buttons"><button class="primary" onclick="joinTeam()">이 팀으로 참가</button></div><p class="info">팀당 대표 1명이 접속합니다. 미션은 팀 전원이 함께 수행합니다.</p></div><div id="playerRoll" class="hidden"><div class="buttons"><button class="primary" onclick="act('roll')">🎲 주사위 던지기</button></div></div><div id="adminLogin" class="hidden"><input type="password" id="pin" placeholder="관리자 PIN" style="width:100%"><div class="buttons"><button onclick="login()" class="primary">관리자 로그인</button></div></div><div id="controls" class="hidden"><div class="buttons"><button class="primary" onclick="act('roll')">🎲 주사위</button><button class="green" onclick="act('buy')">🏠 땅 구매</button><button onclick="act('upgrade')">🏢 건물 올리기</button></div></div></div>
<div class="panel mission hidden" id="missionBox"><h2 id="missionTitle"></h2><p id="missionDetail"></p><div id="targetArea" class="hidden"><label>상대 팀 지정</label><select id="target"></select><button onclick="changeTarget()">변경</button></div><div id="missionControls" class="hidden"><p>사회자가 승리 팀을 판정해주세요.</p><div id="winners" class="buttons"></div><div class="buttons"><button onclick="act('skip')">⏭ 미션 건너뛰기</button></div></div></div>
<div class="panel"><h2>👥 참가 팀</h2><div id="teams" class="teams"></div></div>
<div class="panel" id="share"><h2>📱 참가 QR</h2><img id="qr" alt="QR 코드"><p class="info" style="overflow-wrap:anywhere" id="joinUrl"></p><p class="info">사회자가 화면에 띄우면 팀 대표들이 휴대폰 카메라로 찍어 접속합니다.</p></div>
<div class="panel hidden" id="adminExtra"><h2>⚙️ 사회자 설정</h2><div class="buttons"><button onclick="act('finish')">🏆 게임 종료</button><button class="red" onclick="if(confirm('게임 기록을 초기화할까요?'))act('reset')">🔄 새 게임</button></div><p class="info">기본 PIN은 2026입니다. 행사 전 변경하세요.</p></div></aside></main>
<script>
let s=null,mode=new URLSearchParams(location.search).get('mode')||'view',myTeam=localStorage.getItem('marbleTeam'),pin=sessionStorage.getItem('marblePin')||'',busy=false;
const colors=['#ff617e','#56b7fa','#62db9a','#ffcf50','#bd93ff','#ff9a4e','#ff7dd7','#d2e4ff'];
const fmt=n=>Math.round(n/10000).toLocaleString()+'만';
function setMode(m){mode=m;history.replaceState(null,'','?mode='+m);render();}
function login(){pin=document.getElementById('pin').value.trim();sessionStorage.setItem('marblePin',pin);render();}
async function act(type,extra={}){if(busy)return;busy=true;try{const r=await fetch('/api/action',{method:'POST',headers:{'content-type':'application/json','x-admin-pin':pin},body:JSON.stringify({type,team:Number(myTeam),...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');await poll();}catch(e){alert(e.message);}finally{busy=false;}}
async function joinTeam(){const team=Number(document.getElementById('joinTeam').value);try{const r=await fetch('/api/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'join',team})});if(!r.ok)throw Error('참가 실패');myTeam=team;localStorage.setItem('marbleTeam',team);await poll();}catch(e){alert(e.message);}}
function changeTarget(){act('defender',{defender:Number(document.getElementById('target').value)});}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});s=await r.json();render();}catch(e){document.getElementById('notice').textContent='서버 연결 중...';}}
function render(){if(!s)return;const admin=mode==='admin'&&!!pin;const t=s.teams[s.turn],own=s.properties[t.pos],ground=s.tiles[t.pos],canBuy=ground.price&&!own&&t.cash>=ground.price,canUp=own&&own.owner===t.id&&own.level<2,active=mode==='player'&&Number(myTeam)===t.id;
document.getElementById('round').textContent=s.round+'라운드';document.getElementById('phase').textContent=s.finished?'게임 종료':s.phase==='mission'?'미션 진행':'주사위 대기';
document.getElementById('dice').textContent=s.dice?['','⚀','⚁','⚂','⚃','⚄','⚅'][s.dice]:'🎲';
document.getElementById('turnTitle').textContent=s.finished?'🏆 최종 결과':t.name+' 차례';document.getElementById('message').textContent=s.message;
document.getElementById('board').innerHTML=s.tiles.map((v,i)=>{const p=s.properties[i],owners=p?'<div class="owner" style="background:'+colors[p.owner]+'"></div>':'';const pieces=s.teams.filter(x=>x.pos===i).map(x=>'<div class="token" title="'+x.name+'" style="background:'+colors[x.id]+'"></div>').join('');return '<div class="tile '+(t.pos===i?'current':'')+'"><span class="nr">'+i+'</span>'+owners+'<div class="nm">'+v.name+'</div><div class="cost">'+(v.price?fmt(v.price):'EVENT')+(p?' 🏢'.repeat(p.level):'')+'</div><div class="tokens">'+pieces+'</div></div>';}).join('');
document.getElementById('rank').innerHTML=s.rank.map((x,i)=>'<div class="row rank"><span>'+(i+1)+'위 <b style="color:'+colors[x.id]+'">'+x.name+'</b></span><span class="money">'+fmt(x.total)+'</span></div>').join('');
document.getElementById('teams').innerHTML=s.teams.map(x=>'<div class="team '+(x.id===t.id?'turn':'')+'"><div class="row"><b style="color:'+colors[x.id]+'">● '+x.name+'</b><span class="tag">'+(x.joined?'접속':'대기')+'</span></div><div class="row"><span>현금 '+fmt(x.cash)+'</span><span>땅 '+Object.values(s.properties).filter(p=>p.owner===x.id).length+'개</span></div></div>').join('');
document.getElementById('join').classList.toggle('hidden',mode!=='player'||myTeam!==null);document.getElementById('joinTeam').innerHTML=s.teams.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');
document.getElementById('playerRoll').classList.toggle('hidden',!active||s.phase!=='roll'||s.finished);
document.getElementById('adminLogin').classList.toggle('hidden',mode!=='admin'||!!pin);
document.getElementById('controls').classList.toggle('hidden',!admin||s.finished);
document.querySelector('#controls button:nth-child(1)').disabled=s.phase!=='roll';document.querySelector('#controls button:nth-child(2)').disabled=!canBuy||s.phase!=='mission';document.querySelector('#controls button:nth-child(3)').disabled=!canUp||s.phase!=='mission';
document.getElementById('adminExtra').classList.toggle('hidden',!admin);
const m=s.mission;document.getElementById('missionBox').classList.toggle('hidden',!m);if(m){document.getElementById('missionTitle').textContent=m.title;document.getElementById('missionDetail').textContent=m.detail+' · 승리 보상 '+fmt(m.reward);document.getElementById('targetArea').classList.toggle('hidden',!admin);document.getElementById('target').innerHTML=s.teams.filter(x=>x.id!==m.attacker).map(x=>'<option '+(x.id===m.defender?'selected':'')+' value="'+x.id+'">'+x.name+'</option>').join('');document.getElementById('missionControls').classList.toggle('hidden',!admin);document.getElementById('winners').innerHTML=[m.attacker,m.defender].filter((v,i,a)=>a.indexOf(v)===i).map(id=>'<button class="'+(id===m.attacker?'primary':'red')+'" data-winner="'+id+'">'+s.teams.find(t=>t.id===id).name+' 승리</button>').join('');document.querySelectorAll('[data-winner]').forEach(b=>b.onclick=()=>act('resolve',{winner:Number(b.dataset.winner)}));}
const link=location.origin+'/?mode=player';document.getElementById('joinUrl').textContent=link;document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(link);}
poll();setInterval(poll,1800);
</script></body></html>
