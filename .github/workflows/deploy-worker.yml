name: Deploy Oksoon AI chat server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate required config
        env:
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$CF_DATABASE_ID" || (echo "Set repo variable CF_DATABASE_ID" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Set secret CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CF_API_TOKEN" || (echo "Set secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "Set secret OPENAI_API_KEY" && exit 1)
      - name: Configure D1 binding
        env:
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
        run: |
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$CF_DATABASE_ID/" wrangler.toml
      - name: Install Wrangler CLI
        run: npm install -g wrangler@4
      - name: Create database tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute oksoon-chat --remote --file=backend/schema.sql
      - name: Set OpenAI secret on Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf %s "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
